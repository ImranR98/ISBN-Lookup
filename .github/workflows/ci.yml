name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Test Node server, lookup, and CLI with coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-output.log

      - name: Reject skipped or missing Node tests
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '# SKIP|skipped [1-9][0-9]*|todo [1-9][0-9]*' test-output.log; then
            echo "::error::Node tests were skipped or marked todo."
            grep -E '# SKIP|skipped [1-9][0-9]*|todo [1-9][0-9]*' test-output.log
            exit 1
          fi
          if ! grep -Eq 'pass [1-9][0-9]*' test-output.log; then
            echo "::error::No Node tests ran."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            excel_desktop_ui/requirements.txt
            excel_desktop_ui/requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r excel_desktop_ui/requirements-dev.txt

      - name: Test Python desktop core logic with coverage
        shell: bash
        run: |
          set -o pipefail
          python -m pytest excel_desktop_ui/tests -q -rs \
            --cov=isbn_lookup_excel_desktop_ui \
            --cov-report=term-missing \
            --cov-report=xml:coverage-python.xml \
            --cov-fail-under=95 2>&1 | tee pytest-output.log

      - name: Reject skipped or missing Python tests
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '[0-9]+ skipped' pytest-output.log; then
            echo "::error::Python tests were skipped."
            exit 1
          fi
          if ! grep -Eq '[1-9][0-9]* passed' pytest-output.log; then
            echo "::error::No Python tests ran."
            exit 1
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage-node/lcov.info
            coverage-python.xml
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: isbn-lookup:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke production image
        run: bash scripts/smoke-image.sh isbn-lookup:ci

  publish:
    name: publish
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-isbn-lookup
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: images
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/isbn-lookup"
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:sha-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.images.outputs.image }}
          TAGS: ${{ steps.images.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "no image digest" >&2; exit 1; }
          {
            echo "image: ${IMAGE}"
            echo "digest: ${DIGEST}"
            echo "tags:"
            while IFS= read -r tag; do
              printf '  %s\n' "$tag"
            done <<< "$TAGS"
          } > image-digest.txt
          {
            echo "## Published image"
            echo
            echo '```'
            cat image-digest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ github.sha }}
          path: image-digest.txt
          if-no-files-found: error
          overwrite: true
